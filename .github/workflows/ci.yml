name: CI (tests on PRs)

# Pull requests never ran any checks before — the test suites only ran inside the
# deploy workflow on push to main, so a bad PR (incl. an automated dependency bump)
# could only be caught after merge. This gates every PR with the same offline checks
# the deploy uses (pyflakes + render smoke) plus the hand-computed value suites, so a
# Dependabot bump (Gap E) must pass them before it can merge.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pyflakes
          python -m pip install --quiet -r requirements.txt

      - name: pyflakes — undefined names crash pages at render time
        run: |
          python -m pyflakes app.py ui/ data/ analysis/ jobs/ utils/ \
            | grep -v "imported but unused\|redefinition of unused\|unable to detect undefined names" \
            | tee /tmp/pyflakes.txt || true
          if grep -q "undefined name" /tmp/pyflakes.txt; then
            echo "::error::pyflakes found undefined names — would crash at render time"
            exit 1
          fi

      - name: Render smoke (Home sections with populated fake data)
        run: python tests/test_render_smoke.py

      # EVERY suite, discovered — not a hand-maintained list. The list gated 16
      # of the repo's 151 test modules, so a suite could pin a behaviour and
      # never run: on 2026-08-02 a merged, DEPLOYED change regressed a contract
      # pinned by tests/test_valuation_model_consensus.py, which wasn't listed.
      # CI was green throughout. Most of the audit's own pinning suites
      # (test_cache_stale_fallback, test_financial_highlights_tbvps,
      # test_filings_escaping, test_deeplink_subtab, test_form13f_matching, …)
      # were unlisted too, so the fixes they protect were unenforced.
      # Discovery means adding a test file is enough to have it gate merges.
      - name: Full test suite (discovered)
        run: python -m unittest discover -s tests -t . -v 2>&1 | tail -40

      - name: Hand-computed value + extractor suites (offline)
        run: |
          python -m unittest \
            tests.test_audit_regressions \
            tests.test_dcf_and_models \
            tests.test_sec_filing_scraper \
            tests.test_nav_renders \
            tests.test_deploy_secret_contract \
            tests.test_cache_read_ceilings \
            tests.test_frontier_from_events \
            tests.test_geo_bank_picker \
            tests.test_tbv_conventions \
            tests.test_valuation_model_consensus \
            tests.test_sec_8k_adapter \
            tests.test_audit_20260727_p3 \
            tests.test_capital_dynamics_equity \
            tests.test_consensus_excel_periods \
            tests.test_deal_comps \
            tests.test_earnings_results
          PYTHONIOENCODING=utf-8 python tests/test_metric_formulas.py
