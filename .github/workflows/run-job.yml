name: Run Cloud Run Job

# Manual trigger for any of our Cloud Run jobs, using the same WIF
# credentials as the deploy workflow. Lets an operator (or Claude) fire
# e.g. refresh-universe without a locally authenticated gcloud.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Cloud Run job to execute"
        required: true
        type: choice
        options:
          - refresh-universe
          - refresh-sod
          - refresh-ffiec
          - poll-events
          - live-audit
          - refresh-prices
          - verify-metrics
          - backfill-fdic-history
      args:
        description: >-
          Optional container args override, comma-separated (gcloud --args
          syntax), e.g. "-m,jobs.backfill_fdic_history,refill". Empty = the
          job's own configured args.
        required: false
        type: string
        default: ""
      logs_only:
        description: >-
          Skip execution; only print the job's recent Cloud Logging output
          (the last 3 hours). Use to read the counts a finished execution
          printed.
        required: false
        type: boolean
        default: false

env:
  PROJECT_ID: ace-beanbag-486220-a8
  REGION: us-central1

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: github-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Execute job and wait
        if: ${{ !inputs.logs_only }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.args }}" ]; then
            ARGS+=(--args="${{ inputs.args }}")
          fi
          gcloud run jobs execute "${{ inputs.job }}" \
            --region="${{ env.REGION }}" \
            "${ARGS[@]}" \
            --wait

      # gcloud's --wait streams only progress dots; the job's own prints
      # (e.g. backfill-fdic-history's "store now N certs / M rows") land in
      # Cloud Logging. Surface them here so an operator without a local
      # gcloud can read a run's outcome from the Actions log.
      - name: Print the job's container output (Cloud Logging, last 3h)
        if: ${{ always() }}
        run: |
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${{ inputs.job }}" \
            --project="${{ env.PROJECT_ID }}" \
            --freshness=3h --order=asc --limit=400 \
            --format="value(timestamp,textPayload)" \
            || echo "::warning::could not read Cloud Logging (github-deployer lacks roles/logging.viewer?)"
