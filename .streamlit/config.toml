[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#0f172a"
font = "sans serif"

[server]
headless = true
# XSRF protection ON (partner security assessment, 2026-09-22): the three
# file_uploader widgets are POST endpoints; the token cookie rides the same
# origin through the load balancer + IAP. Streamlit forces CORS off when
# XSRF is on.
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
