<!doctype html>
<!--
  Identity Platform sign-in probe (pre-switch acceptance test).

  Signs in DIRECTLY against Identity Platform from http://localhost (an
  authorized domain by default) so the access rules can be proven BEFORE IAP
  trusts Identity Platform. A successful sign-in here grants nothing in prod:
  until the IAP toggle flips, IAP only accepts Google identities + IAM.

  Run:  python -m http.server 8765 --bind 127.0.0.1 -d tools
  Open: http://localhost:8765/gcip_signin_probe.html?key=<Identity Platform web API key>
  (The API key is public by design — Identity Platform > Application setup details.)

  Credentials are typed by the person signing in, never by automation.
  Steps that use it: docs/ACCESS-RUNBOOK.md, "Pre-switch acceptance test".
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-in Probe</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --ok:#0a7a32; --bad:#b3261e; --line:#ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151515; --fg:#eee; --muted:#aaa; --ok:#5fd38a; --bad:#ff8a80; --line:#333; } }
  body { background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; max-width:640px; margin:32px auto; padding:0 16px; }
  h1 { font-size:20px; } .muted { color:var(--muted); }
  fieldset { border:1px solid var(--line); border-radius:8px; margin:16px 0; padding:12px 16px; }
  input { width:100%; box-sizing:border-box; margin:4px 0 10px; padding:8px; }
  button { padding:8px 14px; margin:4px 8px 4px 0; cursor:pointer; }
  pre { background:transparent; border:1px solid var(--line); border-radius:8px; padding:12px; white-space:pre-wrap; word-break:break-word; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
</style>
</head>
<body>
<h1>Identity Platform sign-in probe</h1>
<p class="muted">Project <code>ace-beanbag-486220-a8</code>. Each attempt signs out first, so results are independent.</p>

<fieldset>
  <legend>Federated</legend>
  <button id="google">Sign in with Google</button>
  <button id="microsoft">Sign in with Microsoft</button>
</fieldset>

<fieldset>
  <legend>Email and password</legend>
  <label>Email <input id="email" type="email" autocomplete="username"></label>
  <label>Password <input id="password" type="password" autocomplete="current-password"></label>
  <button id="pw">Sign in</button>
</fieldset>

<pre id="out" aria-live="polite">Ready.</pre>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
  import { getAuth, signInWithPopup, signInWithEmailAndPassword, signOut,
           GoogleAuthProvider, OAuthProvider }
    from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

  const out = document.getElementById("out");
  const show = (cls, text) => { out.className = cls; out.textContent = text; };
  const apiKey = new URLSearchParams(location.search).get("key");
  if (!apiKey) {
    show("bad", "Add ?key=<Identity Platform web API key> to the URL.");
    throw new Error("no api key");
  }
  const auth = getAuth(initializeApp({
    apiKey, authDomain: "ace-beanbag-486220-a8.firebaseapp.com",
  }));

  async function attempt(label, fn) {
    await signOut(auth).catch(() => {});
    show("", label + " …");
    try {
      const { user } = await fn();
      show("ok", [
        "SIGNED IN via " + label,
        "email:          " + user.email,
        "email verified: " + user.emailVerified,
        "uid:            " + user.uid,
        "linked:         " + user.providerData.map(p => p.providerId).join(", "),
        "created:        " + user.metadata.creationTime,
      ].join("\n"));
    } catch (e) {
      // auth/admin-restricted-operation = sign-up disabled refused an
      // unprovisioned account (the expected result for a stranger).
      show("bad", "REFUSED via " + label + "\ncode:    " + e.code + "\nmessage: " + e.message);
    } finally {
      await signOut(auth).catch(() => {});
    }
  }

  document.getElementById("google").onclick = () =>
    attempt("Google", () => signInWithPopup(auth, new GoogleAuthProvider()));
  document.getElementById("microsoft").onclick = () =>
    attempt("Microsoft", () => signInWithPopup(auth, new OAuthProvider("microsoft.com")));
  document.getElementById("pw").onclick = () =>
    attempt("email/password", () => signInWithEmailAndPassword(auth,
      document.getElementById("email").value.trim(),
      document.getElementById("password").value));
</script>
</body>
</html>
